name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, design lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nafeer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Nafeer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check design-system regressions
        run: npm run lint:design

      - name: Build production app
        run: npm run build
